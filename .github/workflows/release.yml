name: Build desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-15
            command: npm run dist:mac -- --arm64 --publish never
            artifact: macOS-Apple-Silicon-installer
          - platform: macOS Intel
            runner: macos-15-intel
            command: npm run dist:mac -- --x64 --publish never
            artifact: macOS-Intel-installer
          - platform: Windows
            runner: windows-latest
            command: npm run dist:win -- --publish never
            artifact: Windows-installer
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/VIVI-*-win-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create GitHub release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p publish
          release_assets=()
          version="${GITHUB_REF_NAME#v}"
          while IFS= read -r -d '' asset; do
            case "$(basename "$asset")" in
              VIVI-*-mac-arm64.dmg) filename="VIVI-${version}-mac-Apple-Silicon.dmg" ;;
              VIVI-*-mac-x64.dmg) filename="VIVI-${version}-mac-Intel.dmg" ;;
              VIVI-*-win-x64.exe) filename="VIVI-${version}-Windows-x64.exe" ;;
              *) continue ;;
            esac
            target="publish/${filename}"
            cp "$asset" "$target"
            release_assets+=("$target")
          done < <(find installers -maxdepth 1 -type f \( -name 'VIVI-*-mac-*.dmg' -o -name 'VIVI-*-win-*.exe' \) -print0)
          test "${#release_assets[@]}" -gt 0
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f "tag_name=${GITHUB_REF_NAME}" \
              -F "generate_release_notes=true"
          fi
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${release_assets[@]}"
