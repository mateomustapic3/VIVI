name: Build desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: macos-15
            command: npm run dist:mac -- --arm64 --publish never
            artifact: macOS-ARM64-installer
          - platform: macOS Intel
            runner: macos-15-intel
            command: npm run dist:mac -- --x64 --publish never
            artifact: macOS-Intel-installer
          - platform: Windows
            runner: windows-latest
            command: npm run dist:win -- --publish never
            artifact: Windows-installer
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/VIVI-*-win-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create GitHub release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' release_assets < <(
            find installers -maxdepth 1 -type f \( -name 'VIVI-*-mac-*.dmg' -o -name 'VIVI-*-win-*.exe' \) -print0
          )
          test "${#release_assets[@]}" -gt 0
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              case "${asset}" in
                VIVI-*-mac-arm64.dmg|VIVI-*-mac-x64.dmg|VIVI-*-win-x64.exe) ;;
                *) gh release delete-asset "${GITHUB_REF_NAME}" "${asset}" --repo "${GITHUB_REPOSITORY}" --yes ;;
              esac
            done < <(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${release_assets[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes "${release_assets[@]}"
          fi
